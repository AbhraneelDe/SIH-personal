{% extends 'base.html' %}

{% block title %}Log In — SkillPassport{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="sp-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="sp-brand fs-3 mb-2">
            <i class="fa-solid fa-passport text-primary"></i> SkillPassport
          </div>
          <h4 class="fw-bold">Welcome Back</h4>
          <p class="text-muted small">Sign in to your SkillPassport account</p>
        </div>

        <!-- Quick 1-Click Demo Login Box -->
        <div class="p-3 bg-primary-subtle rounded-3 mb-4 text-center">
          <div class="fw-bold text-primary small mb-2"><i class="fa-solid fa-bolt me-1"></i> INSTANT DEMO LOGIN</div>
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'demo_login' role='student' %}" class="btn btn-sm btn-primary">
              <i class="fa-solid fa-user-graduate me-1"></i> Student Demo (Alex)
            </a>
            <a href="{% url 'demo_login' role='recruiter' %}" class="btn btn-sm btn-dark">
              <i class="fa-solid fa-user-tie me-1"></i> Recruiter Demo
            </a>
          </div>
        </div>

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" required placeholder="alex_morgan">
          </div>

          <div class="mb-4">
            <label for="id_password" class="form-label fw-semibold">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-sp-primary w-100 py-2">Sign In</button>
        </form>

        <div class="text-center mt-4">
          <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-semibold">Create one</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
