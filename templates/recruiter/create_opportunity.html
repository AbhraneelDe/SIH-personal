{% extends 'base.html' %}

{% block title %}Post Opportunity — SkillPassport{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="sp-card p-4 p-md-5">
        <h3 class="fw-bold mb-1"><i class="fa-solid fa-plus-circle text-primary me-2"></i> Create New Opportunity</h3>
        <p class="text-muted small mb-4">Define required skills and preferred evidence to match with qualified student passports.</p>

        <form method="post" action="{% url 'create_opportunity' %}">
          {% csrf_token %}

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Opportunity Title</label>
              <input type="text" name="title" class="form-control" placeholder="e.g. AI Research Intern" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Organization Name</label>
              <input type="text" name="organization" class="form-control" placeholder="TechCorp AI" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" class="form-select">
                <option value="INTERNSHIP" selected>Internship</option>
                <option value="JOB">Full-Time Job</option>
                <option value="RESEARCH">Research Opportunity</option>
                <option value="HACKATHON">Hackathon</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Location Type</label>
              <select name="location_type" class="form-select">
                <option value="HYBRID" selected>Hybrid</option>
                <option value="REMOTE">Remote</option>
                <option value="ON_SITE">On-Site</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Application Deadline</label>
              <input type="date" name="application_deadline" class="form-control" value="2026-12-31" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Duration</label>
              <input type="text" name="duration" class="form-control" value="3 - 6 Months">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Stipend / Compensation</label>
              <input type="text" name="stipend" class="form-control" value="$4,000 / month">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Detailed Description</label>
            <textarea name="description" class="form-control" rows="4" placeholder="Describe the responsibilities, project scope, and team dynamic..." required></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Required Skills for Evidence Matching</label>
            <div class="row g-2 border p-3 rounded max-h-200 overflow-y-auto">
              {% for sk in skills %}
                <div class="col-md-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="skills" value="{{ sk.id }}" id="opp_sk_{{ sk.id }}">
                    <label class="form-check-label small" for="opp_sk_{{ sk.id }}">{{ sk.name }}</label>
                  </div>
                </div>
              {% endfor %}
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'recruiter_dashboard' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-sp-primary px-4">Publish Opportunity</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
